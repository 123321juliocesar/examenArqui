<text class="node-title" x="795" y="275">Cliente</text><text class="node-sub" x="795" y="310">Inicia la compra</text>
<text class="node-title" x="795" y="455">Catálogo</text><text class="node-sub" x="795" y="490">Products.tsx · handleAdd</text>
<text class="node-title" x="795" y="635">Carrito dinámico</text><text class="node-sub" x="795" y="670">App.tsx + CartSidebar.tsx</text>
<text class="node-title" x="795" y="815">API del frontend</text><text class="node-sub" x="795" y="850">lib/api.ts · placeOrder</text>
<text class="node-title" x="795" y="995">Ruta y controlador</text><text class="node-sub" x="795" y="1030">POST /api/pedidos · create</text>
<text class="node-title" x="795" y="1175">PedidosService.create</text><text class="node-sub" x="795" y="1210">valida y coordina transacción</text>
<text class="node-title" x="1525" y="1315">MySQL: productos</text><text class="node-sub" x="1525" y="1350">precio, stock, activo</text>
<text class="node-title" x="795" y="1525">MySQL: pedido</text><text class="node-small" x="795" y="1553">pedidos · pedido_detalles</text><text class="node-small" x="795" y="1579">productos.stock · movimientos_stock</text>
<text class="node-title" x="795" y="1775">Administrador</text><text class="node-sub" x="795" y="1810">OrdersPanel.tsx · verifica entrega</text>
<text class="node-title" x="795" y="1955">Ruta y controlador</text><text class="node-sub" x="795" y="1990">POST /api/pedidos/:id/cerrar</text>
<text class="node-title" x="795" y="2135">PedidosService.close</text><text class="node-sub" x="795" y="2170">valida estado y monto</text>
<text class="node-title" x="795" y="2315">MySQL: cierre de venta</text><text class="node-small" x="795" y="2350">pagos · pedidos.estado = ENTREGADO</text>
<path class="edge" d="M795 340 V404"/><circle cx="795" cy="372" r="20" fill="#2f6fed"/><text class="number" x="795" y="373">1</text><text class="edge-text" x="1070" y="380">idProducto elegido, cantidad</text>
<path class="edge" d="M795 520 V584"/><circle cx="795" cy="552" r="20" fill="#8652bf"/><text class="number" x="795" y="553">2</text><text class="edge-text" x="1070" y="560">CartItem: id, qty, stock mostrado</text>
<path class="edge" d="M795 700 V764"/><circle cx="795" cy="732" r="20" fill="#8652bf"/><text class="number" x="795" y="733">3</text><text class="edge-text" x="1070" y="740">items, dirección y notas</text>
<path class="edge" d="M795 880 V944"/><circle cx="795" cy="912" r="20" fill="#cf7920"/><text class="number" x="795" y="913">4</text><text class="edge-text" x="1070" y="920">JSON + JWT → POST /api/pedidos</text>
<path class="edge" d="M795 1060 V1124"/><circle cx="795" cy="1092" r="20" fill="#cf7920"/><text class="number" x="795" y="1093">5</text><text class="edge-text" x="75" y="1100">id_usuario autenticado + body</text>
<path class="edge" d="M1020 1190 C1140 1190 1170 1325 1294 1325"/><circle cx="1152" cy="1240" r="20" fill="#cf7920"/><text class="number" x="1152" y="1241">6</text><text class="edge-text" x="1130" y="1180">IDs → SELECT ... FOR UPDATE</text>
<path class="edge" d="M1525 1252 V1087 H1050 V1160 H1027"/><circle cx="1420" cy="1087" r="20" fill="#278454"/><text class="number" x="1420" y="1088">7</text><text class="edge-text" x="1395" y="1052">precio y stock vigentes → servicio</text>
<path class="edge" d="M795 1240 V1484"/><circle cx="795" cy="1385" r="20" fill="#cf7920"/><text class="number" x="795" y="1386">8</text><text class="edge-text" x="870" y="1366">total y detalles calculados</text><text class="edge-text" x="870" y="1395">INSERT pedido/detalle; UPDATE stock;</text><text class="edge-text" x="870" y="1424">INSERT movimiento (una transacción)</text>
<path class="edge" d="M795 1600 V1724"/><circle cx="795" cy="1662" r="20" fill="#278454"/><text class="number" x="795" y="1663">9</text><text class="edge-text" x="1070" y="1670">idPedido, total, CONFIRMADO vía API</text>
<path class="edge" d="M795 1840 V1904"/><circle cx="795" cy="1872" r="20" fill="#2f6fed"/><text class="number" x="795" y="1873">10</text><text class="edge-text" x="1070" y="1880">idPedido, medio y monto verificados</text>
<path class="edge" d="M795 2020 V2084"/><circle cx="795" cy="2052" r="20" fill="#cf7920"/><text class="number" x="795" y="2053">11</text><text class="edge-text" x="1070" y="2060">idPedido, idAdmin, medio y monto</text>
<path class="edge" d="M795 2200 V2264"/><circle cx="795" cy="2232" r="20" fill="#cf7920"/><text class="number" x="795" y="2233">12</text><text class="edge-text" x="1070" y="2240">INSERT pago + UPDATE pedido ENTREGADO</text>
<text class="subtitle" x="75" y="2440">Pago contraentrega: “SIMULADO” sirve para la demostración y no representa dinero real.</text>
