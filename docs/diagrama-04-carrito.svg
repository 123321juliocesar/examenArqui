<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="2460" viewBox="0 0 1900 2460" role="img" aria-labelledby="title desc">
<title id="title">Diagrama de flujo: venta iniciada desde el carrito</title><desc id="desc">Doce elementos y doce flechas rotuladas. Desde el cliente hasta pedido entregado y pago registrado.</desc>
<defs><marker id="head" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L10 6.5 L1 12" fill="none" stroke="#526783" stroke-width="2.5"/></marker><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14243b" flood-opacity="0.13"/></filter><style>text{font-family:Arial,Helvetica,sans-serif;fill:#16263e}.heading{font-size:43px;font-weight:700}.subtitle{font-size:23px;fill:#52647b}.section{font-size:20px;font-weight:700;letter-spacing:1.2px;fill:#48617e}.node-title{font-size:26px;font-weight:700;text-anchor:middle}.node-sub{font-size:21px;fill:#465a72;text-anchor:middle}.node-small{font-size:18px;fill:#465a72;text-anchor:middle}.edge{fill:none;stroke:#526783;stroke-width:3.5;marker-end:url(#head)}.edge-text{font-size:21px;fill:#354b65}.number{font-size:19px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}</style></defs>
